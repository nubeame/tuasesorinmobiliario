<header id="main-header">
  <div class="container">
    <a href="/" class="screen-reader-text">Tu Asesor Inmobiliario</a>
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="slide-menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="5" width="20" height="2.2"/><rect x="2" y="11" width="20" height="2.2"/><rect x="2" y="17" width="20" height="2.2"/></svg></button>
  </div>
</header>
<main id="main-content">
<section class="contact-section">
  <div class="row">
    <div class="logo-redes"><img src="/images/logoredes_TAI-1.jpg" width="250" height="111" alt="Tu asesor inmobiliario"></div>
    <h1>PONTE EN CONTACTO CONMIGO</h1>
  </div>
  <div class="row">
    <div class="contact-form-wrap">
      <form id="contact-form" class="contact-form" novalidate>
        <p class="form-message" role="status" aria-live="polite"></p>
        <p class="field half"><label class="screen-reader-text" for="f-nombre">Nombre</label><input type="text" id="f-nombre" name="nombre" placeholder="Nombre" autocomplete="name" required></p>
        <p class="field half"><label class="screen-reader-text" for="f-email">Email</label><input type="email" id="f-email" name="email" placeholder="Email" autocomplete="email" required></p>
        <p class="field"><label class="screen-reader-text" for="f-mensaje">Mensaje</label><textarea id="f-mensaje" name="mensaje" placeholder="Mensaje" required></textarea></p>
        <p class="field"><label class="screen-reader-text" for="f-telefono">Teléfono</label><input type="tel" id="f-telefono" name="telefono" placeholder="Teléfono" autocomplete="tel" required></p>
        <p class="hp" aria-hidden="true"><label for="f-website">No rellenar</label><input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off"></p>
        <input type="hidden" name="captcha_a" value=""><input type="hidden" name="captcha_b" value="">
        <div class="contact-bottom">
          <p class="captcha"><span class="captcha-question"></span> = <label class="screen-reader-text" for="f-captcha">Resultado de la suma</label><input type="text" id="f-captcha" name="captcha" inputmode="numeric" size="2" required></p>
          <button type="submit" class="btn-submit">Enviar</button>
        </div>
      </form>
    </div>
  </div>
</section>
</main>

        Vía Augusta, 29, 1º –&nbsp; 08006 BARCELONA</p>
      </div>
    </div>
  </div>
  <div id="footer-bottom"></div>
</footer>
